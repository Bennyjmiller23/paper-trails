<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Follow the journey of a traveling book with Paper Trails."
  >

  <title>
    Paper Trails — Every Book Has a Journey
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >
<link
  rel="stylesheet"
  href="passport.css"
>
</head>


<body>

  <header class="nav">

    <a
      class="brand"
      href="index.html"
      aria-label="Paper Trails home"
    >

      <span class="brand-mark">
        ⌁
      </span>

      <span>
        Paper Trails
      </span>

    </a>

    <span class="nav-tagline">
      Every book has a journey.
    </span>

  </header>


  <main class="section">

    <div
      id="content"
      class="journey-card"
      aria-live="polite"
    >

      <div class="loading-state">

        <span class="eyebrow">
          PAPER TRAILS
        </span>

        <h1>
          Following the trail…
        </h1>

        <p>
          We're finding this book's journey.
        </p>

      </div>

    </div>

  </main>


  <footer class="footer">

    <p>
      Give a favorite book a new home.
    </p>

    <a href="index.html">
      Start a new Paper Trail
    </a>

  </footer>


<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<script
  type="module"
  src="book.js"
></script>

</body>

</html>
